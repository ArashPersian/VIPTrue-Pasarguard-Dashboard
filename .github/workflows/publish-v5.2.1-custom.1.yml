name: Publish v5.2.1-custom.1 release

on:
  push:
    branches:
      - agent/publish-v5.2.1-custom.1
    paths:
      - .github/workflows/publish-v5.2.1-custom.1.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@v4
        with:
          ref: v5.2.1-custom.1
          fetch-depth: 0
      - name: Verify tagged source
        run: |
          set -euo pipefail
          test "$(git rev-list -n 1 v5.2.1-custom.1)" = "98e2054f6e40fcc5a0c5bb32f1c2e85625210cb3"
          test "$(cat .viptrue/upstream-version)" = "v5.2.1"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        working-directory: dashboard
        run: bun install --frozen-lockfile
      - name: Verify VIPTrue invariants
        working-directory: dashboard
        run: bun run verify:viptrue
      - name: Lint VIPTrue surfaces
        working-directory: dashboard
        run: bun run lint:viptrue
      - name: Build dashboard
        run: ./build_dashboard.sh
      - name: Verify performance budgets
        working-directory: dashboard
        run: bun run verify:performance
      - name: Package release
        run: ./scripts/package-dashboard.sh v5.2.1-custom.1
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v5.2.1-custom.1 \
            dist/viptrue-dashboard-v5.2.1-custom.1.tar.gz \
            dist/viptrue-dashboard-v5.2.1-custom.1.tar.gz.sha256 \
            --verify-tag \
            --title "VIPTrue Dashboard v5.2.1-custom.1" \
            --notes "Compatible upstream version: v5.2.1"
