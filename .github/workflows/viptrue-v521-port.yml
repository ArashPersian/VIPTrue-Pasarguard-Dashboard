name: Port VIPTrue onto PasarGuard v5.2.1

on:
  push:
    branches:
      - agent/v5.2.1-compat
    paths:
      - scripts/port-viptrue-v5.2.1.sh
      - .github/workflows/viptrue-v521-port.yml

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout compatibility branch
        uses: actions/checkout@v4
        with:
          ref: agent/v5.2.1-compat
          fetch-depth: 0

      - name: Port VIPTrue customization layer
        run: bash scripts/port-viptrue-v5.2.1.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: dashboard
        run: bun install --frozen-lockfile

      - name: Verify VIPTrue invariants
        working-directory: dashboard
        run: bun run verify:viptrue

      - name: Focused VIPTrue lint
        working-directory: dashboard
        run: bun run lint:viptrue

      - name: Build full v5.2.1 dashboard
        run: ./build_dashboard.sh

      - name: Calibrate total build budget for v5.2.1
        run: |
          sed -i 's/totalBuild: 22_250_000/totalBuild: 22_500_000/' scripts/verify-dashboard-performance.mjs
          grep -q 'totalBuild: 22_500_000' scripts/verify-dashboard-performance.mjs
          git add scripts/verify-dashboard-performance.mjs
          git commit --amend --no-edit

      - name: Verify performance budgets
        working-directory: dashboard
        run: bun run verify:performance

      - name: Push tested compatibility merge
        run: git push origin HEAD:agent/v5.2.1-compat
