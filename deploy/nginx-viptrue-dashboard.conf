# Include this file inside the panel.vip504.com HTTPS server block.
# The release installer maintains /var/lib/viptrue/dashboard/current atomically.

location = /dashboard {
    return 308 /dashboard/;
}

location ^~ /dashboard/ {
    root /var/lib/viptrue/dashboard/current;
    try_files $uri /dashboard/index.html;

    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    add_header Pragma "no-cache";
    add_header Expires "0";
}

location ^~ /statics/ {
    root /var/lib/viptrue/dashboard/current;
    try_files $uri =404;

    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location = /manifest.webmanifest {
    root /var/lib/viptrue/dashboard/current;
    try_files $uri =404;
    add_header Cache-Control "no-store";
}

location = /sw.js {
    root /var/lib/viptrue/dashboard/current;
    try_files $uri =404;
    add_header Cache-Control "no-store";
}
